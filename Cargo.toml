[package]
name = "vault-mgmt"
version = "0.1.8"
edition = "2021"
description = "Manage your vault installation in Kubernetes (upgrades, unseal, step-down, ...)."
license = "MIT"
homepage = "https://github.com/nimbolus/vault-mgmt"
repository = "https://github.com/nimbolus/vault-mgmt"
readme = "README.md"
keywords = ["vault", "kubernetes", "upgrade"]
categories = ["command-line-utilities"]

[lib]
name = "vault_mgmt_lib"
path = "src/lib.rs"

[[bin]]
name = "vault-mgmt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive", "wrap_help"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "registry",
    "env-filter",
] }
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7.15"
tokio-rustls = "0.26.2"
hyper = "1.6.0"
futures-util = "0.3.31"
kube = { version = "4.2.0", default-features = false, features = [
    "client",
    "config",
    "runtime",
    "rustls-tls",
    "ring",
    "ws",
] }
k8s-openapi = { version = "0.28.0", features = ["earliest"] }
serde_json = "1.0.140"
secrecy = { version = "0.10.3", features = ["serde"] }
prettytable = "0.10.0"
serde = "1.0.219"
tower-test = "0.4.0"
http = "1.3.1"
async-trait = "0.1.88"
wiremock = "0.6.3"
clap_complete = "4.5.47"
self_update = { version = "1.3.1", default-features = false, features = [
    "reqwest",
    "rustls",
    "github",
    "progress-bar",
    "archive-tar",
    "compression-tar-gz",
] }
tokio-retry = "0.3.0"
rustls = { version = "0.23.26", default-features = false, features = [
    "log",
    "logging",
    "ring",
    "std",
    "tls12",
] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.11", features = [
    "client-legacy",
    "http1",
    "tokio",
] }
rustls-native-certs = "0.8.1"

[dev-dependencies]
rand = "0.8.5"
which = "7.0.3"
serde-saphyr = "2.0.0"
