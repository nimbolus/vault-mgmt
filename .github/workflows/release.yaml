name: release binaries
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  checks: write
  actions: read
  issues: read
  packages: write
  pull-requests: read
  repository-projects: read
  statuses: read

jobs:
  test:
    name: test suite
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  draft-release:
    name: create draft release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the notes cover the commits since the previous tag
          fetch-depth: 0
      - name: Release notes
        id: notes
        uses: ./.github/actions/release-notes
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # tags like v0.2.0-rc.1 must not become the latest release used by self-update
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: release binaries
    needs: draft-release
    strategy:
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          cd target/${{ matrix.target }}/release/
          tar czvf "vault-mgmt-${{ github.ref_name }}-${{ matrix.target }}".tar.gz \
            vault-mgmt
      - uses: actions/upload-artifact@v4
        with:
          name: vault-mgmt-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          path: target/${{ matrix.target }}/release/vault-mgmt-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
      - name: Attach binary to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            target/${{ matrix.target }}/release/vault-mgmt-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease="$PRERELEASE" --repo "${{ github.repository }}"
